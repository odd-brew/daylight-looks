name: Checks

# pull_request and every push, including a push to main.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lua:
    name: Lua 5.1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Looks syntax
        run: luac5.1 -p Looks/Looks.lua

      - name: Looks check
        run: lua5.1 tools/looks_check.lua

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Secret scan
        run: bash tools/secret_scan.sh
